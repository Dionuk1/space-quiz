<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b1f" />
  <title>Orbit Quiz — Space exploration practice</title>
  <style>
    /* 
      THESIS: A mission console makes astronomy practice feel like a short expedition, not a worksheet.
      OWN-WORLD: Ink-blue space, cyan instrument marks, solar yellow, and coral alert states on matte panels.
      STORY: Students launch, answer one observation at a time, read the signal, and return with a score.
      FIRST VIEWPORT: A narrow centered console opens with the mission title, one line of promise, and a launch control.
      FORM: Single-column instrument panel; intentionally refuses the category-default grid of trivia cards.
    */
    :root {
      color-scheme: light;
      --bg: #eef4f7;
      --bg-deep: #dce8ee;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-solid: #ffffff;
      --ink: #12233d;
      --muted: #587087;
      --line: #c9d9e3;
      --cyan: #067d9b;
      --cyan-soft: #d8f3f5;
      --yellow: #f0bb2f;
      --yellow-deep: #9c6d00;
      --green: #07855b;
      --green-soft: #d9f4e9;
      --red: #c6434f;
      --red-soft: #fde4e4;
      --shadow: 0 24px 70px rgba(24, 58, 84, 0.16), 0 4px 12px rgba(24, 58, 84, 0.08);
      --radius: 22px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #070b1f;
        --bg-deep: #0c1730;
        --panel: rgba(15, 25, 53, 0.9);
        --panel-solid: #101a35;
        --ink: #f4f7fb;
        --muted: #a7bad0;
        --line: #2b3c5c;
        --cyan: #63d8ed;
        --cyan-soft: #123849;
        --yellow: #ffd05c;
        --yellow-deep: #ffe095;
        --green: #55dfa9;
        --green-soft: #123e38;
        --red: #ff8290;
        --red-soft: #4a222d;
        --shadow: 0 28px 80px rgba(0, 0, 0, 0.38), 0 3px 14px rgba(0, 0, 0, 0.25);
      }
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(145deg, var(--bg), var(--bg-deep));
      color: var(--ink);
      font: 400 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .app-shell {
      width: min(100%, 590px);
      position: relative;
    }

    .console {
      background: var(--panel);
      border: 1px solid rgba(148, 183, 199, 0.48);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      overflow: hidden;
      backdrop-filter: blur(14px);
      animation: lift-in 720ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      letter-spacing: 0.02em;
      font-weight: 750;
      font-size: 0.88rem;
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--yellow);
      display: grid;
      place-items: center;
      color: #152037;
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--yellow) 18%, transparent);
      font-size: 0.9rem;
    }

    .mission-status {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 700;
    }

    .progress-wrap {
      padding: 20px 22px 0;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .score-count { color: var(--cyan); }

    .progress-track {
      height: 8px;
      margin-top: 10px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      transform: scaleX(0);
      transform-origin: left center;
      background: linear-gradient(90deg, var(--cyan), var(--yellow));
      border-radius: inherit;
      transition: transform 420ms cubic-bezier(.16, 1, .3, 1);
    }

    .content {
      padding: 32px 22px 26px;
    }

    .screen[hidden] { display: none; }

    .launch-screen {
      min-height: 405px;
      display: grid;
      align-content: center;
      gap: 22px;
      padding: 18px 10px 24px;
    }

    .orbit-icon {
      width: 86px;
      height: 86px;
      position: relative;
      margin: 0 auto;
      border: 2px solid var(--cyan);
      border-radius: 50%;
      transform: rotate(-18deg);
      animation: orbit-drift 7s ease-in-out infinite;
    }

    .orbit-icon::before,
    .orbit-icon::after {
      content: "";
      position: absolute;
      inset: 12px -14px;
      border: 1.5px solid var(--cyan);
      border-radius: 50%;
    }

    .orbit-icon::after {
      inset: -14px 12px;
      border-color: var(--yellow);
      transform: rotate(65deg);
    }

    .planet {
      position: absolute;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: var(--yellow);
      left: 28px;
      top: 26px;
      box-shadow: inset -7px -5px 0 rgba(150, 100, 0, 0.14);
    }

    .launch-copy {
      max-width: 430px;
      margin: 0 auto;
      text-align: center;
    }

    h1, h2, p { margin: 0; }

    h1 {
      max-width: 10ch;
      margin: 0 auto 12px;
      font-size: clamp(2.35rem, 8vw, 3.7rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 850;
    }

    .launch-copy p {
      color: var(--muted);
      font-size: 1rem;
      max-width: 36ch;
      margin: 0 auto;
    }

    .primary-action {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px 18px;
      background: var(--cyan);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 8px 18px color-mix(in srgb, var(--cyan) 28%, transparent);
      transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
    }

    .primary-action:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
      box-shadow: 0 11px 22px color-mix(in srgb, var(--cyan) 34%, transparent);
    }

    .primary-action:active { transform: translateY(0); }

    .primary-action:focus-visible,
    .answer:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--yellow) 75%, transparent);
      outline-offset: 3px;
    }

    .quiz-screen { display: grid; gap: 22px; }

    .question-kicker {
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h2 {
      margin-top: 8px;
      font-size: clamp(1.65rem, 5vw, 2.2rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
      max-width: 19ch;
    }

    .answers {
      display: grid;
      gap: 11px;
    }

    .answer {
      position: relative;
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 72px;
      padding: 14px 16px 14px 15px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--cyan) 7%, transparent), transparent 34%),
        color-mix(in srgb, var(--panel-solid) 68%, transparent);
      text-align: left;
      cursor: pointer;
      box-shadow: inset 0 1px 0 color-mix(in srgb, white 18%, transparent);
      overflow: hidden;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .answer::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--line);
      transition: background 160ms ease, box-shadow 160ms ease;
    }

    .answer::after {
      content: "SELECT";
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      opacity: 0.7;
    }

    .answer:hover:not(:disabled) {
      transform: translateX(4px);
      border-color: var(--cyan);
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--cyan) 18%, transparent), transparent 48%),
        var(--cyan-soft);
      box-shadow: inset 0 1px 0 color-mix(in srgb, white 24%, transparent);
    }

    .answer:hover:not(:disabled)::before,
    .answer:focus-visible::before {
      background: var(--cyan);
    }

    .answer:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--yellow) 75%, transparent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.86rem;
    }

    .answer:hover:not(:disabled) .answer-letter,
    .answer:focus-visible .answer-letter {
      border-color: var(--cyan);
      color: var(--cyan);
      background: color-mix(in srgb, var(--cyan) 12%, transparent);
    }

    .answer.correct {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
      animation: correct-pop 420ms cubic-bezier(.16, 1, .3, 1);
    }

    .answer.correct::before { background: var(--green); }
    .answer.correct::after { content: "CONFIRMED"; color: var(--green); }

    .answer.correct .answer-letter {
      border-color: var(--green);
      background: var(--green);
      color: white;
    }

    .answer.wrong {
      border-color: var(--red);
      background: var(--red-soft);
      color: var(--red);
      animation: wrong-shake 420ms ease;
    }

    .answer.wrong::before { background: var(--red); }
    .answer.wrong::after { content: "REVIEW"; color: var(--red); }

    .answer.wrong .answer-letter {
      border-color: var(--red);
      background: var(--red);
      color: white;
    }

    .feedback {
      min-height: 25px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .feedback strong { color: var(--ink); }
    .feedback.correct { color: var(--green); }
    .feedback.wrong { color: var(--red); }

    .next-action {
      justify-self: end;
      border: 0;
      border-radius: 11px;
      padding: 11px 15px;
      background: var(--ink);
      color: var(--panel-solid);
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .next-action:hover { transform: translateY(-1px); }
    .next-action[hidden] { display: none; }

    .results-screen {
      text-align: center;
      display: grid;
      justify-items: center;
      gap: 17px;
      padding: 22px 8px 16px;
    }

    .result-emoji {
      font-size: 4.5rem;
      line-height: 1;
      animation: result-enter 720ms ease-out both;
    }

    .results-screen h2 { max-width: 15ch; }

    .result-score {
      display: flex;
      align-items: baseline;
      gap: 7px;
      color: var(--cyan);
    }

    .result-score strong {
      font-size: 3.8rem;
      letter-spacing: -0.07em;
      line-height: 1;
    }

    .result-score span {
      color: var(--muted);
      font-weight: 750;
    }

    .result-message {
      color: var(--muted);
      max-width: 38ch;
    }

    .footer-note {
      padding: 0 22px 20px;
      color: var(--muted);
      font-size: 0.76rem;
      text-align: center;
    }

    @keyframes lift-in {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes orbit-drift {
      0%, 100% { transform: rotate(-18deg) translateY(0); }
      50% { transform: rotate(-10deg) translateY(-5px); }
    }

    @keyframes correct-pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.018); }
      100% { transform: scale(1); }
    }

    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(3px); }
    }

    @keyframes result-enter {
      from { opacity: 0; transform: translateY(9px) scale(0.88); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 460px) {
      body { padding: 12px; }
      .top-bar { padding-inline: 17px; }
      .progress-wrap, .footer-note { padding-inline: 17px; }
      .content { padding: 27px 17px 22px; }
      .mission-status { font-size: 0.7rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="console" aria-live="polite">
      <header class="top-bar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> ORBIT QUIZ</div>
        <div class="mission-status" id="missionStatus">Ready to launch</div>
      </header>

      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-meta">
          <span id="questionCount">Question 1 of 10</span>
          <span class="score-count">Score <span id="scoreCount">0</span></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="content">
        <section class="screen launch-screen" id="startScreen">
          <div class="orbit-icon" aria-hidden="true"><span class="planet"></span></div>
          <div class="launch-copy">
            <h1>Chart your way through space.</h1>
            <p>Ten quick questions. Instant signals. See what you know about the universe.</p>
          </div>
          <button class="primary-action" id="startButton" type="button">Start mission <span aria-hidden="true">→</span></button>
        </section>

        <section class="screen quiz-screen" id="quizScreen" hidden>
          <div>
            <div class="question-kicker" id="questionKicker">Observation 01</div>
            <h2 id="questionText"></h2>
          </div>
          <div class="answers" id="answers"></div>
          <div class="feedback" id="feedback" role="status"></div>
          <button class="next-action" id="nextButton" type="button" hidden>Next observation <span aria-hidden="true">→</span></button>
        </section>

        <section class="screen results-screen" id="resultsScreen" hidden>
          <div class="result-emoji" id="resultEmoji" aria-hidden="true">🚀</div>
          <div>
            <div class="question-kicker">Mission complete</div>
            <h2 id="resultTitle">Nice work, explorer.</h2>
          </div>
          <div class="result-score"><strong id="finalScore">0</strong><span>/ 10 correct</span></div>
          <p class="result-message" id="resultMessage"></p>
          <button class="primary-action" id="restartButton" type="button">Run it again <span aria-hidden="true">↻</span></button>
        </section>
      </div>
      <div class="footer-note">Built for curious minds · No signal loss required</div>
    </section>
  </main>

  <script>
    const questions = [
      { question: "Which planet is known as the Red Planet?", answers: ["Venus", "Mars", "Jupiter", "Mercury"], correct: 1 },
      { question: "What is the name of the galaxy that contains our Solar System?", answers: ["Andromeda Galaxy", "Whirlpool Galaxy", "Milky Way", "Sombrero Galaxy"], correct: 2 },
      { question: "What force keeps planets in orbit around the Sun?", answers: ["Magnetism", "Gravity", "Friction", "Light pressure"], correct: 1 },
      { question: "Which object is at the center of our Solar System?", answers: ["Earth", "The Moon", "The Sun", "Jupiter"], correct: 2 },
      { question: "How long does light from the Sun take to reach Earth?", answers: ["About 8 minutes", "About 8 hours", "About 8 seconds", "About 8 days"], correct: 0 },
      { question: "Which planet has the most prominent ring system?", answers: ["Saturn", "Neptune", "Uranus", "Earth"], correct: 0 },
      { question: "What is a light-year a measurement of?", answers: ["Time", "Brightness", "Distance", "Temperature"], correct: 2 },
      { question: "What is the closest star to Earth after the Sun?", answers: ["Sirius", "Polaris", "Proxima Centauri", "Betelgeuse"], correct: 2 },
      { question: "Which phase happens when the Moon is between Earth and the Sun?", answers: ["Full Moon", "New Moon", "First Quarter", "Waning Gibbous"], correct: 1 },
      { question: "What do astronauts wear outside a spacecraft?", answers: ["A pressure suit", "A thermal blanket", "A flight jacket", "A diving suit"], correct: 0 }
    ];

    const startScreen = document.getElementById("startScreen");
    const quizScreen = document.getElementById("quizScreen");
    const resultsScreen = document.getElementById("resultsScreen");
    const progressWrap = document.getElementById("progressWrap");
    const progressFill = document.getElementById("progressFill");
    const progressBar = document.querySelector('[role="progressbar"]');
    const questionCount = document.getElementById("questionCount");
    const scoreCount = document.getElementById("scoreCount");
    const questionKicker = document.getElementById("questionKicker");
    const questionText = document.getElementById("questionText");
    const answers = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");
    const missionStatus = document.getElementById("missionStatus");
    const finalScore = document.getElementById("finalScore");
    const resultEmoji = document.getElementById("resultEmoji");
    const resultTitle = document.getElementById("resultTitle");
    const resultMessage = document.getElementById("resultMessage");

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function showScreen(screen) {
      [startScreen, quizScreen, resultsScreen].forEach((item) => { item.hidden = item !== screen; });
    }

    function updateProgress() {
      const progress = (currentQuestion / questions.length) * 100;
      progressFill.style.transform = `scaleX(${progress / 100})`;
      progressBar.setAttribute("aria-valuenow", currentQuestion);
      questionCount.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      scoreCount.textContent = score;
    }

    function renderQuestion() {
      answered = false;
      const item = questions[currentQuestion];
      questionKicker.textContent = `Observation ${String(currentQuestion + 1).padStart(2, "0")}`;
      questionText.textContent = item.question;
      feedback.className = "feedback";
      feedback.textContent = "";
      nextButton.hidden = true;
      answers.innerHTML = "";

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + index)}</span><span>${answer}</span>`;
        button.addEventListener("click", () => selectAnswer(index, button));
        answers.appendChild(button);
      });

      updateProgress();
    }

    function selectAnswer(selected, selectedButton) {
      if (answered) return;
      answered = true;
      const item = questions[currentQuestion];
      const allButtons = [...answers.querySelectorAll(".answer")];
      allButtons.forEach((button) => { button.disabled = true; });

      if (selected === item.correct) {
        score += 1;
        selectedButton.classList.add("correct");
        feedback.className = "feedback correct";
        feedback.innerHTML = "<strong>Signal confirmed.</strong> That’s correct.";
      } else {
        selectedButton.classList.add("wrong");
        allButtons[item.correct].classList.add("correct");
        feedback.className = "feedback wrong";
        feedback.innerHTML = `<strong>Signal missed.</strong> The answer is ${item.answers[item.correct]}.`;
      }

      scoreCount.textContent = score;
      nextButton.textContent = currentQuestion === questions.length - 1 ? "View results →" : "Next observation →";
      nextButton.hidden = false;
    }

    function finishQuiz() {
      const percentage = score / questions.length;
      finalScore.textContent = score;
      if (percentage === 1) {
        resultEmoji.textContent = "🌟";
        resultTitle.textContent = "Stellar navigation.";
        resultMessage.textContent = "Every signal landed. You have a bright grasp of the basics.";
      } else if (percentage >= 0.7) {
        resultEmoji.textContent = "🚀";
        resultTitle.textContent = "Strong flight path.";
        resultMessage.textContent = "You’re building real momentum. A little more practice and you’ll be orbiting the top score.";
      } else if (percentage >= 0.4) {
        resultEmoji.textContent = "🛰️";
        resultTitle.textContent = "Good first orbit.";
        resultMessage.textContent = "You’ve got a few strong signals. Run the mission again to lock in the rest.";
      } else {
        resultEmoji.textContent = "🔭";
        resultTitle.textContent = "Keep observing.";
        resultMessage.textContent = "Every explorer starts by looking up. Try again and watch your score climb.";
      }
      missionStatus.textContent = "Mission complete";
      progressFill.style.transform = "scaleX(1)";
      progressBar.setAttribute("aria-valuenow", questions.length);
      showScreen(resultsScreen);
    }

    function startQuiz() {
      currentQuestion = 0;
      score = 0;
      missionStatus.textContent = "In progress";
      progressWrap.hidden = false;
      showScreen(quizScreen);
      renderQuestion();
    }

    document.getElementById("startButton").addEventListener("click", startQuiz);
    document.getElementById("restartButton").addEventListener("click", startQuiz);
    nextButton.addEventListener("click", () => {
      if (currentQuestion === questions.length - 1) {
        finishQuiz();
      } else {
        currentQuestion += 1;
        renderQuestion();
      }
    });
  </script>
</body>
</html>
